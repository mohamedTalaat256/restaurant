<p-toast></p-toast>


<p-card [header]="translate.instant('label_manual_journal_entry')">
  <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
    <div class="w-100 row">
      <app-form-input class="col-md-6" [control]="$any(transactionForm.get('transactionDate'))"
        label="label_date" placeholder="dd/mm/yyyy" type="date"></app-form-input>

      <app-form-input class="col-md-6" [control]="$any(transactionForm.get('transactionType'))"
        label="label_transaction_type" placeholder="label_select_transaction_type" [options]="transactionTypes()" type="select" [filter]="true"></app-form-input>

      <app-form-input class="col-md-5" [control]="$any(transactionForm.get('sourceAccountId'))"
        label="label_source_account" placeholder="label_select_source_account" [options]="sourceAccountOptions()" type="select" [filter]="true"></app-form-input>

      <app-form-input class="col-md-2" [control]="$any(transactionForm.get('amount'))"
        label="label_amount" placeholder="label_amount" type="number"></app-form-input>

      <app-form-input class="col-md-5" [control]="$any(transactionForm.get('destinationAccountId'))"
        label="label_destination_account" placeholder="label_select_destination_account" [options]="destinationAccountOptions()" type="select" [filter]="true"></app-form-input>

      <app-form-input class="col-md-6" [control]="$any(transactionForm.get('costCenterId'))"
        label="label_cost_center" placeholder="label_select_cost_center" [options]="costCenterOptions()" type="select"></app-form-input>

      <app-form-input class="col-md-6" [control]="$any(transactionForm.get('reference'))"
        label="label_reference" type="text"></app-form-input>

      <app-form-input class="col-md-12" [control]="$any(transactionForm.get('description'))"
        label="label_description" type="textarea"></app-form-input>



      <div class="col-12 flex justify-content-start gap-2">
        <p-button [label]="translate.instant('label_submit')" icon="pi pi-check" severity="success" type="submit"
          [disabled]="transactionForm.invalid" [loading]="loading">
        </p-button>
        <p-button [label]="translate.instant('label_reset')" icon="pi pi-refresh" severity="secondary" type="button" (onClick)="initForm()">
        </p-button>
      </div>

    </div>
  </form>
</p-card>
