<p-toast></p-toast>
<p-toolbar class="mb-6">
  <ng-template #start>
    <p-button [label]="translate.instant('label_add_cost_center')" icon="pi pi-plus" severity="secondary" class="m-inline-end-1" (onClick)="openNew()" />
  </ng-template>
</p-toolbar>

<p-table #dt [value]="costCenterService.costCenters()" [loading]="costCenterService.loading()" [rows]="10" [paginator]="true"
  [globalFilterFields]="['code', 'name']"
  [tableStyle]="{ 'min-width': '50rem' }" [rowHover]="true" dataKey="id"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} cost centers" [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]">
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">{{ translate.instant('label_manage_cost_centers') }}</h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" [placeholder]="translate.instant('label_search')" />
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="id" style="width: 3rem">
        {{ translate.instant('label_id') }}
        <p-sortIcon field="id" />
      </th>
      <th pSortableColumn="code" style="width: 5rem">
        {{ translate.instant('label_code') }}
        <p-sortIcon field="code" />
      </th>
      <th pSortableColumn="name" style="width: 8rem">
        {{ translate.instant('label_name') }}
        <p-sortIcon field="name" />
      </th>
      <th pSortableColumn="status" style="width: 4rem">
        {{ translate.instant('label_status') }}
        <p-sortIcon field="status" />
      </th>
      <th style="width: 6rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-costCenter>
    <tr>
      <td>{{ costCenter.id }}</td>
      <td>{{ costCenter.code }}</td>
      <td>{{ costCenter.name }}</td>
      <td>
        <p-tag [value]="costCenter.status ? translate.instant('label_active') : translate.instant('label_inactive')"
          [severity]="costCenter.status ? 'success' : 'danger'"></p-tag>
      </td>
      <td>
        <p-button icon="pi pi-pencil" class="m-inline-end-1" [rounded]="true" [outlined]="true" (click)="editCostCenter(costCenter)" />
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteCostCenter(costCenter)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [visible]="costCenterService.costCenterDialog()" [style]="{ width: '450px' }" [header]="translate.instant('label_cost_center_details')" [modal]="true" (onHide)="hideDialog()">
  <ng-template #content>
    <form [formGroup]="costCenterForm" class="pb-3">
      <div class="mt-4 pt-3">
        <app-form-input [control]="$any(costCenterForm.get('code'))" label="label_code"> </app-form-input>
        <app-form-input [control]="$any(costCenterForm.get('name'))" label="label_name"> </app-form-input>
        <app-form-input [control]="$any(costCenterForm.get('status'))" label="label_status" type="select"
          [options]="[{label: translate.instant('label_active'), value: true}, {label: translate.instant('label_inactive'), value: false}]"> </app-form-input>
      </div>
    </form>
  </ng-template>
  <ng-template #footer>
    <p-button [label]="translate.instant('label_cancel')" icon="pi pi-times" text (click)="hideDialog()" />
    <p-button [label]="translate.instant('label_save')" icon="pi pi-check" (click)="saveCostCenter()" [loading]="costCenterService.loadingSave()" />
  </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
