<p-toast></p-toast>
<p-toolbar class="mb-6">
  <ng-template #start>
    <p-button [showIfCanCreate]="menuItemId" [label]="translate.instant('label_add_cash_counter')" icon="pi pi-plus" severity="secondary" class="m-inline-end-1" (onClick)="openNew()" />
  </ng-template>

  <ng-template #end>
  </ng-template>
</p-toolbar>

<p-table #dt [value]="cashCounterService.cashCounters()" [loading]="cashCounterService.loading()" [rows]="10" [paginator]="true"
  [globalFilterFields]="['number']"
  [tableStyle]="{ 'min-width': '40rem' }" [rowHover]="true" dataKey="id"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} cash counters" [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]">
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">{{ translate.instant('label_manage_cash_counters') }}</h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" [placeholder]="translate.instant('label_search')" />
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="id" style="width: 4rem">
        {{ translate.instant('label_id') }}
        <p-sortIcon field="id" />
      </th>
      <th pSortableColumn="number" style="width:6rem">
        {{ translate.instant('label_number') }}
        <p-sortIcon field="number" />
      </th>
      <th style="width: 6rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-cashCounter>
    <tr>
      <td>{{ cashCounter.id }}</td>
      <td>{{ cashCounter.number }}</td>
      <td>
        <p-button icon="pi pi-pencil" class="m-inline-end-1" [rounded]="true" [outlined]="true" [showIfCanEdit]="menuItemId" (click)="editCashCounter(cashCounter)" />
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" [showIfCanDelete]="menuItemId" (click)="deleteCashCounter(cashCounter)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [visible]="cashCounterService.cashCounterDialog()" [style]="{ width: '450px' }" [header]="translate.instant('label_cash_counter_details')" [modal]="true" (onHide)="hideDialog()">

  <ng-template #content>
    <form [formGroup]="cashCounterForm" class="pb-3">
      <div class="mt-4 pt-3">
        <app-form-input [control]="$any(cashCounterForm.get('number'))" label="label_number" type="number"> </app-form-input>
      </div>
    </form>
  </ng-template>

  <ng-template #footer>
    <p-button [label]="translate.instant('label_cancel')" icon="pi pi-times" text (click)="hideDialog()" />
    <p-button [label]="translate.instant('label_save')" icon="pi pi-check" (click)="saveCashCounter()" [loading]="cashCounterService.loadingSave()" />
  </ng-template>

</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
