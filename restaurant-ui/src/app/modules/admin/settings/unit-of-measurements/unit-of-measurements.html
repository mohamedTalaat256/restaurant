<p-toast></p-toast>
<p-toolbar class="mb-6">
  <ng-template #start>
    <p-button [showIfCanCreate]="menuItemId" [label]="translate.instant('label_add_uom')" icon="pi pi-plus" severity="secondary" class="m-inline-end-1" (onClick)="openNew()" />
  </ng-template>

  <ng-template #end>
   </ng-template>
</p-toolbar>

<p-table #dt [value]="uomService.uoms()" [loading]="uomService.loading()" [rows]="10" [columns]="cols" [paginator]="true"
  [globalFilterFields]="['name', 'shortName']"
  [tableStyle]="{ 'min-width': '60rem' }" [rowHover]="true" dataKey="id"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} users" [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]">
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">{{ translate.instant('label_manage_uoms') }}</h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" [placeholder]="translate.instant('label_search')" />
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th style="width: 2rem">
        <p-tableHeaderCheckbox />
      </th>
      <th pSortableColumn="id" style="width: 4rem">
        {{ translate.instant('label_id') }}
        <p-sortIcon field="id" />
      </th>
      <th pSortableColumn="name" style="width:6rem">
        {{ translate.instant('label_name') }}
        <p-sortIcon field="name" />
      </th>

      <th pSortableColumn="shortName" style="width:6rem">
        {{ translate.instant('label_short_name') }}
        <p-sortIcon field="shortName" />
      </th>

      <th pSortableColumn="status" style="width:4rem">
        {{ translate.instant('label_status') }}
        <p-sortIcon field="status" />
      </th>

      <th style="width: 6rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-uom>
    <tr>
      <td>
        <p-tableCheckbox [value]="uom" />
      </td>
      <td>{{ uom.id }}</td>
      <td>
        <div class="d-flex align-items-center gap-2">

          <span>  {{ uom.name + ' ' + uom.shortName }}</span>
        </div>
      </td>
      <td>{{ uom.shortName }}</td>
      <td>
        <p-tag [value]="uom.status ? translate.instant('label_active') : translate.instant('label_inactive')"
          [severity]="uom.status ? 'success' : 'danger'"></p-tag>
      </td>
      <td>
        <p-button icon="pi pi-pencil" class="m-inline-end-1" [rounded]="true" [outlined]="true" [showIfCanEdit]="menuItemId" (click)="editUom(uom)" />
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" [showIfCanDelete]="menuItemId" (click)="deleteUom(uom)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [visible]="uomService.uomDialog()" [style]="{ width: '450px' }" [header]="translate.instant('label_uom_details')" [modal]="true" (onHide)="hideDialog()">

  <ng-template #content>
    <form [formGroup]="uomForm" enctype="multipart/form-data" class="pb-3">
        <div class="mt-4 pt-3">
           <app-form-input [control]="$any(uomForm.get('name'))" label="label_name"> </app-form-input>
            <app-form-input [control]="$any(uomForm.get('shortName'))" label="label_short_name"> </app-form-input>
            <app-form-input [control]="$any(uomForm.get('status'))" label="label_status" type="checkbox"> </app-form-input>

        </div>
    </form>
  </ng-template>

  <ng-template #footer>
    <p-button [label]="translate.instant('label_cancel')" icon="pi pi-times" text (click)="hideDialog()" />
    <p-button [label]="translate.instant('label_save')" icon="pi pi-check" (click)="saveUom()" [loading]="uomService.loadingSave()" />
  </ng-template>


</p-dialog>


<p-confirmdialog [style]="{ width: '450px' }" />
