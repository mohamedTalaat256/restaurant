<p-toast></p-toast>
<p-toolbar class="mb-6">
  <ng-template #start>
    <p-button [showIfCanCreate]="menuItemId" [label]="translate.instant('label_add_language')" icon="pi pi-plus" severity="secondary" class="m-inline-end-1" (onClick)="openNew()" />
  </ng-template>

  <ng-template #end>
  </ng-template>
</p-toolbar>

<p-table #dt [value]="languageService.languages()" [loading]="languageService.loading()" [rows]="10" [columns]="cols" [paginator]="true"
  [globalFilterFields]="['name']"
  [tableStyle]="{ 'min-width': '40rem' }" [rowHover]="true" dataKey="id"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} languages" [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]">
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">{{ translate.instant('label_manage_languages') }}</h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" [placeholder]="translate.instant('label_search')" />
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="code" style="width: 4rem">
        {{ translate.instant('label_code') }}
        <p-sortIcon field="code" />
      </th>
      <th pSortableColumn="name" style="width:6rem">
        {{ translate.instant('label_name') }}
        <p-sortIcon field="name" />
      </th>
      <th pSortableColumn="isDefault" style="width:4rem">
        {{ translate.instant('label_is_default') }}
        <p-sortIcon field="isDefault" />
      </th>
      <th style="width: 6rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-language>
    <tr>
      <td>{{ language.languageCode }}</td>
      <td>{{ language.name }} </td>
      <td>
        <p-tag [value]="language.isDefault ? translate.instant('label_yes') : translate.instant('label_no')"
          [severity]="language.isDefault ? 'success' : 'info'"></p-tag>
      </td>
      <td>
        <p-button icon="pi pi-pencil" class="m-inline-end-1" [rounded]="true" [outlined]="true" [showIfCanEdit]="menuItemId" (click)="editLanguage(language)" />
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" [showIfCanDelete]="menuItemId" (click)="deleteLanguage(language)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [visible]="languageService.languageDialog()" [style]="{ width: '450px' }" [header]="translate.instant('label_language_details')" [modal]="true" (onHide)="hideDialog()">

  <ng-template #content>
    <form [formGroup]="languageForm" class="pb-3">
      <div class="mt-4 pt-3">
        <app-form-input [control]="$any(languageForm.get('name'))" label="label_name"> </app-form-input>
        <app-form-input [control]="$any(languageForm.get('languageCode'))" label="label_code"> </app-form-input>
        <app-form-input [control]="$any(languageForm.get('isDefault'))" label="label_is_default" type="checkbox"> </app-form-input>
      </div>
    </form>
  </ng-template>

  <ng-template #footer>
    <p-button [label]="translate.instant('label_cancel')" icon="pi pi-times" text (click)="hideDialog()" />
    <p-button [label]="translate.instant('label_save')" icon="pi pi-check" (click)="saveLanguage()" [loading]="languageService.loadingSave()" />
  </ng-template>

</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
