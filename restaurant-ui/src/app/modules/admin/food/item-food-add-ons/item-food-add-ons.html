<p-toast></p-toast>
<p-toolbar class="mb-6">
  <ng-template #start>
    <p-button [showIfCanCreate]="menuItemId" [label]="translate.instant('label_add_item_food_add_ons')" icon="pi pi-plus" severity="secondary" class="m-inline-end-1" (onClick)="openNew()" />
  </ng-template>

  <ng-template #end>
  </ng-template>
</p-toolbar>

<p-table #dt [value]="itemFoodAddOnsService.itemFoodAddOns()" [loading]="itemFoodAddOnsService.loading()" [rows]="10" [paginator]="true"
  [globalFilterFields]="['name']"
  [tableStyle]="{ 'min-width': '60rem' }" [rowHover]="true" dataKey="id"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} item food add-ons" [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]">
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">{{ translate.instant('label_manage_item_food_add_ons') }}</h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" [placeholder]="translate.instant('label_search')" />
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="id" style="width: 4rem">
        {{ translate.instant('label_id') }}
        <p-sortIcon field="id" />
      </th>
      <th pSortableColumn="name" style="width:6rem">
        {{ translate.instant('label_name') }}
        <p-sortIcon field="name" />
      </th>
      <th pSortableColumn="price" style="width:4rem">
        {{ translate.instant('label_price') }}
        <p-sortIcon field="price" />
      </th>
      <th pSortableColumn="status" style="width:4rem">
        {{ translate.instant('label_status') }}
        <p-sortIcon field="status" />
      </th>
      <th style="width: 6rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-itemFoodAddOns>
    <tr>
      <td>{{ itemFoodAddOns.id }}</td>
      <td>{{ itemFoodAddOns.name }}</td>
      <td>{{ itemFoodAddOns.price }}</td>
      <td>
        <p-tag [value]="itemFoodAddOns.status ? translate.instant('label_active') : translate.instant('label_inactive')"
          [severity]="itemFoodAddOns.status ? 'success' : 'danger'"></p-tag>
      </td>
      <td>
        <p-button icon="pi pi-pencil" class="m-inline-end-1" [rounded]="true" [outlined]="true" [showIfCanEdit]="menuItemId" (click)="editItemFoodAddOns(itemFoodAddOns)" />
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" [showIfCanDelete]="menuItemId" (click)="deleteItemFoodAddOns(itemFoodAddOns)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [visible]="itemFoodAddOnsService.itemFoodAddOnsDialog()" [style]="{ width: '450px' }" [header]="translate.instant('label_item_food_add_on_details')" [modal]="true" (onHide)="hideDialog()">

  <ng-template #content>
    <form [formGroup]="itemFoodAddOnsForm" class="pb-3">
      <div class="mt-4 pt-3">
        <app-form-input [control]="$any(itemFoodAddOnsForm.get('name'))" label="label_name"> </app-form-input>
        <app-form-input [control]="$any(itemFoodAddOnsForm.get('price'))" label="label_price" type="number"> </app-form-input>
        <app-form-input [control]="$any(itemFoodAddOnsForm.get('status'))" label="label_status" type="checkbox"> </app-form-input>
      </div>
    </form>
  </ng-template>

  <ng-template #footer>
    <p-button [label]="translate.instant('label_cancel')" icon="pi pi-times" text (click)="hideDialog()" />
    <p-button [label]="translate.instant('label_save')" icon="pi pi-check" (click)="saveItemFoodAddOns()" [loading]="itemFoodAddOnsService.loadingSave()" />
  </ng-template>

</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
