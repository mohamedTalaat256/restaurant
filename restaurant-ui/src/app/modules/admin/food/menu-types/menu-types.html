<p-toast></p-toast>
<p-toolbar class="mb-6">
  <ng-template #start>
    <p-button [showIfCanCreate]="menuItemId" [label]="translate.instant('label_add_menu_type')" icon="pi pi-plus" severity="secondary" class="m-inline-end-1" (onClick)="openNew()" />
  </ng-template>

  <ng-template #end>
  </ng-template>
</p-toolbar>

<p-table #dt [value]="menuTypeService.menuTypes()" [loading]="menuTypeService.loading()" [rows]="10" [columns]="cols" [paginator]="true"
  [globalFilterFields]="['name']"
  [tableStyle]="{ 'min-width': '40rem' }" [rowHover]="true" dataKey="id"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} menu types" [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]">
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">{{ translate.instant('label_manage_menu_types') }}</h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" [placeholder]="translate.instant('label_search')" />
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="id" style="width: 2rem">
        {{ translate.instant('label_id') }}
        <p-sortIcon field="id" />
      </th>
      <th pSortableColumn="name" style="width:8rem">
        {{ translate.instant('label_name') }}
        <p-sortIcon field="name" />
      </th>
      <th pSortableColumn="status" style="width:4rem">
        {{ translate.instant('label_status') }}
        <p-sortIcon field="status" />
      </th>
      <th style="width: 6rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-menuType>
    <tr>
      <td>{{ menuType.id }}</td>
      <td>
         <div class="d-flex align-items-center gap-2">
          <img [src]="imagesUrl+menuType.image" class="image">
          {{ menuType.name }}
        </div>
      </td>
      <td>
        <p-tag [value]="menuType.status ? translate.instant('label_active') : translate.instant('label_inactive')"
          [severity]="menuType.status ? 'success' : 'danger'"></p-tag>
      </td>
      <td>
        <p-button [showIfCanEdit]="menuItemId" icon="pi pi-pencil" class="m-inline-end-1" [rounded]="true" [outlined]="true" (click)="editMenuType(menuType)" />
        <p-button [showIfCanDelete]="menuItemId" icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteMenuType(menuType)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [visible]="menuTypeService.menuTypeDialog()" [style]="{ width: '450px' }" [header]="translate.instant('label_menu_type_details')" [modal]="true" (onHide)="hideDialog()">

  <ng-template #content>
    <form [formGroup]="menuTypeForm" class="pb-3">
      <div class="mt-4 pt-3">
        <app-form-input [control]="$any(menuTypeForm.get('name'))" label="label_name"> </app-form-input>
        <app-form-input [control]="$any(menuTypeForm.get('status'))" label="label_status" type="checkbox"> </app-form-input>

        <div class="mb-3">
          <label class="form-label">{{ translate.instant('label_image') }}</label>
          <input type="file" class="form-control" accept="image/*" (change)="onImageSelected($event)" />
        </div>
      </div>
    </form>
  </ng-template>

  <ng-template #footer>
    <p-button [label]="translate.instant('label_cancel')" icon="pi pi-times" text (click)="hideDialog()" />
    <p-button [label]="translate.instant('label_save')" icon="pi pi-check" (click)="saveMenuType()" [loading]="menuTypeService.loadingSave()" />
  </ng-template>

</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
