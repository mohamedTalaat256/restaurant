<p-toast></p-toast>
<p-toolbar class="mb-6">
  <ng-template #start>
    <p-button [showIfCanCreate]="menuItemId" [label]="translate.instant('label_add_role')" icon="pi pi-plus" severity="secondary" class="m-inline-end-1"
      (onClick)="openNew()" />

  </ng-template>

  <ng-template #end>

  </ng-template>
</p-toolbar>

<p-table #dt [value]="roleService.roles()" [loading]="roleService.loading()" [rows]="10"
  [paginator]="true" [globalFilterFields]="['name', 'description']"
  [tableStyle]="{ 'min-width': '60rem' }" [rowHover]="true" dataKey="id"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} roles" [showCurrentPageReport]="true"
  [rowsPerPageOptions]="[10, 20, 30]">
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0">{{ translate.instant('label_manage_roles') }}</h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onGlobalFilter(dt, $event)"
          [placeholder]="translate.instant('label_search')" />
      </p-iconfield>
    </div>
  </ng-template>

  <ng-template #header>
    <tr>
      <th pSortableColumn="id" style="width: 4rem">
        {{ translate.instant('label_id') }}
        <p-sortIcon field="id" />
      </th>
      <th pSortableColumn="name" style="width:6rem">
        {{ translate.instant('label_name') }}
        <p-sortIcon field="name" />
      </th>

      <th pSortableColumn="description" style="width:6rem">
        {{ translate.instant('label_description') }}
        <p-sortIcon field="description" />
      </th>

      <th pSortableColumn="status" style="width:4rem">
        {{ translate.instant('label_status') }}
        <p-sortIcon field="status" />
      </th>

      <th style="width: 6rem"></th>
    </tr>
  </ng-template>
  <ng-template #body let-role>
    <tr>
      <td>{{ role.id }}</td>
      <td>{{ role.name }}</td>
      <td>{{ role.description }}</td>
      <td>
        <p-tag [value]="role.status ? translate.instant('label_active') : translate.instant('label_inactive')"
          [severity]="role.status ? 'success' : 'danger'"></p-tag>
      </td>
      <td>
        <p-button icon="pi pi-pencil" class="m-inline-end-1" [rounded]="true" [outlined]="true" [showIfCanEdit]="menuItemId" (click)="editRole(role)" />
        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" [showIfCanDelete]="menuItemId" (click)="deleteRole(role)" />
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog [visible]="roleService.roleDialog()" [style]="{ width: '450px' }"
  [header]="translate.instant('label_role_details')" [modal]="true" (onHide)="hideDialog()">

  <ng-template #content>
    <form [formGroup]="roleForm" enctype="multipart/form-data" class="pb-3">
    <div class="d-flex flex-column gap-2 mt-4">
      <app-form-input [control]="$any(roleForm.get('name'))" label="label_name"> </app-form-input>
      <app-form-input [control]="$any(roleForm.get('description'))" label="label_description"> </app-form-input>
      <app-form-input [control]="$any(roleForm.get('status'))" label="label_status" type="checkbox"> </app-form-input>
    </div>

    </form>
  </ng-template>

  <ng-template #footer>
    <p-button [label]="translate.instant('label_cancel')" icon="pi pi-times" text (click)="hideDialog()" />
    <p-button [label]="translate.instant('label_save')" icon="pi pi-check" (click)="saveRole()" [loading]="roleService.loadingSave()" />
  </ng-template>


</p-dialog>


<p-confirmdialog [style]="{ width: '450px' }" />
